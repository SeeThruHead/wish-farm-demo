<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wish Farm, a walkthrough</title>
<style>
  :root { --bg: #f6f2ec; --ink: #2b2620; --soft: #6b6257; --accent: #5e7f64; --card: #fffdf9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .count { color: var(--soft); font-variant-numeric: tabular-nums; }
  figure { margin: 0; background: var(--card); border-radius: 18px; box-shadow: 0 8px 24px rgba(60, 40, 20, 0.08); overflow: hidden; }
  figure .pics { display: flex; gap: 12px; justify-content: center; background: #ece5d9; padding: 12px; }
  figure img { display: block; max-width: 100%; max-height: 62vh; border-radius: 10px; }
  figcaption { padding: 18px 22px 22px; }
  figcaption h2 { font-size: 20px; margin: 0 0 6px; }
  figcaption p { margin: 0; color: var(--soft); }
  nav { display: flex; justify-content: space-between; margin-top: 16px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 20px; background: #e8e1d5; color: var(--ink); cursor: pointer; }
  button.next { background: var(--accent); color: white; }
  button:disabled { opacity: 0.5; cursor: default; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Wish Farm, a walkthrough</h1>
    <span class="count" id="count"></span>
  </header>
  <figure>
    <div class="pics" id="pics"></div>
    <figcaption><h2 id="title"></h2><p id="text"></p></figcaption>
  </figure>
  <nav>
    <button id="prev">← Back</button>
    <button id="next" class="next">Next →</button>
  </nav>
  <p class="count">Use the arrow keys too. <a href="https://github.com/SeeThruHead/wish-farm-demo">Read the full README</a>.</p>
</main>
<script>
const slides = [
  { pics: ["02-timeline"], title: "A plan for the money after your bills", text: "Dave earns about $100k and wants a Mac mini, a Onewheel and a studio display, and to clear a credit card and build savings. Each payday shows what came in, what the bills need before the next one, and where every remaining dollar goes." },
  { pics: ["02-timeline"], title: "One thing at a time", text: "Most of each payday goes to the next treat and the rest to the next saving, one at a time, in Dave's order. The Mac mini fills on Nov 13 (Full 🎉), and the Onewheel starts the same day." },
  { pics: ["03-debt-ends"], title: "Debts that end free up money", text: "Marcus pays off his car in June 2027. From then on, that $420 a month goes to his wishes, which here means his FHSA." },
  { pics: ["04-calendar"], title: "The same plan, by month", text: "The calendar shows each month's money in, money out and what went to wishes, with the timeline alongside." },
  { pics: ["07-phone-timeline", "08-phone-calendar-day"], title: "On your phone", text: "Everything fits one column. Tap a day on the calendar to see exactly what happens that day." },
  { pics: ["person-doug", "person-sally"], title: "Doug and Sally", text: "Doug gets his fishing gear today and a fish finder in November, then saves toward a boat. Sally gets a weekend in Montréal before December and has Japan paid for by February." },
  { pics: ["person-sue", "person-marcus"], title: "Sue and Marcus", text: "Sue's deadlines (summer camp, braces, back to school) are spread over the paydays before them. Marcus's plan warns him early that his FHSA 2026 won't be full by December 31." },
  { pics: ["overspend-before"], title: "Then Dave overspends", text: "Before: the $1,200 Dave has on hand goes straight to three wishes, and the Mac mini is paid for on Nov 13." },
  { pics: ["overspend-after"], title: "…and the plan recalculates", text: "A weekend away leaves Dave $600 short. His next paycheque covers the gap first, and the Mac mini moves to Dec 14. With YNAB connected, this happens on its own within the hour." },
  { pics: ["05-setup"], title: "Setup", text: "Cash, income and expenses. Connect YNAB and these fill themselves in from your scheduled transactions, targets and Ready to Assign." },
  { pics: ["06-settings"], title: "Two dials", text: "How much of each payday goes to treats (60% here), and how much savings can lend to finish a treat a payday sooner ($500 here)." },
  { pics: [], title: "What it does in YNAB", text: "Every hour: it sets a target only on the wishes it's funding this month, for exactly what the plan puts in, and clears the rest. When a debt is paid off, it moves the category to Wish Farm Complete and removes the debt's scheduled transaction. It never touches anything else, and it's safe if YNAB is slow or down." }
]
let at = 0
const $ = (id) => document.getElementById(id)
const show = () => {
  const slide = slides[at]
  $("pics").replaceChildren(...slide.pics.map((name) => Object.assign(document.createElement("img"), { src: `images/${name}.png`, alt: slide.title })))
  $("pics").style.display = slide.pics.length === 0 ? "none" : "flex"
  $("title").textContent = slide.title
  $("text").textContent = slide.text
  $("count").textContent = `${at + 1} of ${slides.length}`
  $("prev").disabled = at === 0
  $("next").disabled = at === slides.length - 1
}
const go = (by) => { at = Math.min(slides.length - 1, Math.max(0, at + by)); show() }
$("prev").onclick = () => go(-1)
$("next").onclick = () => go(1)
document.addEventListener("keydown", (event) => { if (event.key === "ArrowRight") go(1); if (event.key === "ArrowLeft") go(-1) })
show()
</script>
</body>
</html>
